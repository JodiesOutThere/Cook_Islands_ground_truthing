<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Land Use in Catchment Management Zones</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/ol3/4.6.5/ol.css">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            flex-direction: row;
            width: 100%;
            height: 100vh;
        }

        #map {
            width: 70%;
            height: 100vh;
        }

        .controls {
            width: 30%;
            padding: 10px;
            background-color: #f9f9f9;
            box-sizing: border-box;
            overflow-y: auto;
        }

        input[type="text"], button {
            width: 100%;
            padding: 10px;
            font-size: 16px;
        }

        button {
            margin-top: 10px;
        }

        h1 {
            font-size: 36px;
        }

        h2 {
            font-size: 18px;
            margin: 20px 0;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            #map {
                width: 100%;
                height: 50vh;
            }

            .controls {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <h1>LandTruths</h1>
    <h2>Paperless ground truthing for spatial datasets</h2>
    <div class="container">
        <div id="map" class="map"></div>
        <div class="controls">
            <h3>Layers</h3>
            <input type="checkbox" id="toggleAllLayers" checked>
            <label for="toggleAllLayers">Cook Islands catchment management zones</label><br>
            <input type="checkbox" id="toggleSatellite" checked>
            <label for="toggleSatellite">Satellite Imagery</label><br>
            <input type="checkbox" id="toggleVaivase" checked>
            <label for="toggleVaivase">Samoa - Vaivase catchment land use</label><br>
            <input type="checkbox" id="toggleMoataaLandUse" checked>
            <label for="toggleMoataaLandUse">Samoa - Moataa region Land use</label><br>
            <input type="checkbox" id="toggleMoataaMangrove" checked>
            <label for="toggleMoataaMangrove">Samoa - Moataa mangrove and wetland extent 2024</label><br>

            <button id="geolocate" class="geolocate-button">Zoom to My Location</button>

            <div class="legend">
                <h3>Legend</h3>
                <!-- Legends for various layers -->
                <img src="https://landtruths.com/geoserver/CI/wms?service=WMS&version=1.1.0&request=GetLegendGraphic&layer=CI:CMZ_Rivers&format=image/png" alt="Rivers Legend"><br>
                <img src="https://landtruths.com/geoserver/CI/wms?service=WMS&version=1.1.0&request=GetLegendGraphic&layer=CI:CMZ_Land_use_fixed_geom&format=image/png" alt="Land Use Legend"><br>
                <!-- Add legends for other layers as needed -->
            </div>

            <h3>Coordinates</h3>
            <p>Click on the map to get Lat/Lon.</p>
            <input type="text" id="latLonDisplay" placeholder="Coordinates will appear here..." readonly>
            <input type="text" id="luUpdate" placeholder="Enter a description about your location">
            <button id="addPoint">Add Point</button>
            <button id="downloadCSV">Download CSV</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ol3/4.6.5/ol.js"></script>
    <script>
        var pointData = [];
        var selectedLatLon = null;

        // Create the OSM base layer
        var osmLayer = new ol.layer.Tile({
            source: new ol.source.OSM()
        });

        // Create the GeoTIFF WMS layer
        var satelliteLayer = new ol.layer.Image({
            source: new ol.source.ImageWMS({
                url: 'https://landtruths.com/geoserver/CI/wms',
                params: {
                    'LAYERS': 'CI:Raro_background_reprojected',
                    'TILED': true,
                    'STYLES': ''
                },
                serverType: 'geoserver',
                crossOrigin: 'anonymous'
            }),
            visible: true
        });

        // Land use layer for Cook Islands
        var landUseLayer = new ol.layer.Tile({
            source: new ol.source.TileWMS({
                url: 'https://landtruths.com/geoserver/CI/wms',
                params: {
                    'LAYERS': 'CI:CMZ_Land_use_fixed_geom',
                    'TILED': true
                },
                serverType: 'geoserver',
                crossOrigin: 'anonymous'
            }),
            visible: true
        });

        // Vaivase and Moataa layers
        var vaivaseLandUseLayer = new ol.layer.Tile({
            source: new ol.source.TileWMS({
                url: 'https://landtruths.com/geoserver/Samoa/wms',
                params: {'LAYERS': 'Samoa:Vaivase_land_use', 'TILED': true},
                serverType: 'geoserver',
                crossOrigin: 'anonymous'
            }),
            visible: true
        });

        var moataaLandUseLayer = new ol.layer.Tile({
            source: new ol.source.TileWMS({
                url: 'https://landtruths.com/geoserver/Samoa/wms',
                params: {'LAYERS': 'Samoa:Moataa_LU', 'TILED': true},
                serverType: 'geoserver',
                crossOrigin: 'anonymous'
            }),
            visible: true
        });

        var moataaMangroveWetlandLayer = new ol.layer.Tile({
            source: new ol.source.TileWMS({
                url: 'https://landtruths.com/geoserver/Samoa/wms',
                params: {'LAYERS': 'Samoa:Moataa_mangrove_and_wetland_extent', 'TILED': true},
                serverType: 'geoserver',
                crossOrigin: 'anonymous'
            }),
            visible: true
        });

        // Initialize the map with all layers
        var map = new ol.Map({
            target: 'map',
            layers: [
                osmLayer,
                satelliteLayer,
                landUseLayer,
                vaivaseLandUseLayer,
                moataaLandUseLayer,
                moataaMangroveWetlandLayer
            ],
            view: new ol.View({
                center: ol.proj.fromLonLat([-159.75, -21.23]),
                zoom: 13
            })
        });

        // Toggle visibility for each layer
        document.getElementById('toggleSatellite').addEventListener('change', function () {
            satelliteLayer.setVisible(this.checked);
        });
        document.getElementById('toggleAllLayers').addEventListener('change', function () {
            landUseLayer.setVisible(this.checked);
        });
        document.getElementById('toggleVaivase').addEventListener('change', function () {
            vaivaseLandUseLayer.setVisible(this.checked);
        });
        document.getElementById('toggleMoataaLandUse').addEventListener('change', function () {
            moataaLandUseLayer.setVisible(this.checked);
        });
        document.getElementById('toggleMoataaMangrove').addEventListener('change', function () {
            moataaMangroveWetlandLayer.setVisible(this.checked);
        });

        // Handle map clicks to get lat/lon and display them
        map.on('click', function(evt) {
            var coordinate = ol.proj.toLonLat(evt.coordinate);
            var lon = coordinate[0].toFixed(6);
            var lat = coordinate[1].toFixed(6);
            selectedLatLon = { lat: lat, lon: lon };
            document.getElementById('latLonDisplay').value = `Lat: ${lat}, Lon: ${lon}`;
        });
    </script>
</body>
</html>
